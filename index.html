<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kim Arthem Son — Full-Stack Developer</title>
    <meta
      name="description"
      content="Kim Arthem Son is a BSIT student and full-stack developer building web and mobile applications, RESTful APIs, and GIS-based systems. Available for OJT internship, December 2026."
    />
    <meta name="theme-color" content="#E8E8E6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Start fetching the hero portrait now instead of after the JS bundle runs. -->
    <link rel="preload" as="image" type="image/avif" href="/img/avatar-400.avif" fetchpriority="high" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Kim Arthem Son — Full-Stack Developer" />
    <meta
      property="og:description"
      content="Full-stack web and mobile applications, RESTful APIs, and GIS-based systems — from database design through to deployed interface."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kim Arthem Son — Full-Stack Developer" />
    <meta
      name="twitter:description"
      content="Full-stack web and mobile applications, RESTful APIs, and GIS-based systems."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Apply the stored theme before first paint to avoid a flash. -->
    <script>
      (function () {
        var theme = 'system';
        try {
          var stored = localStorage.getItem('theme');
          if (stored === 'light' || stored === 'dark' || stored === 'system') theme = stored;
        } catch (e) {}
        var dark =
          theme === 'dark' ||
          (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
